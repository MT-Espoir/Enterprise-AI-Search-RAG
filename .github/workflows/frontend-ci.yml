# ==============================================================
# frontend-ci.yml — CI Pipeline cho Frontend (React + Vite)
# ==============================================================
# Trigger: Push hoặc PR vào branch main/develop
#
# Jobs:
#   1. lint     : ESLint check
#   2. build    : Vite production build để xác nhận không bị lỗi
#   3. test     : Vitest unit tests (nếu có)
#
# TODO: Thêm job deploy lên CDN/Vercel/Nginx sau khi build pass
# ==============================================================

name: Frontend CI

on:
  push:
    branches: [main, develop]
    paths:
      - "frontend/**"
  pull_request:
    branches: [main, develop]
    paths:
      - "frontend/**"

jobs:
  lint:
    name: ESLint Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      # TODO: cd frontend && npm ci
      # TODO: npm run lint

  build:
    name: Vite Build
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      # TODO: cd frontend && npm ci
      # TODO: Set VITE_API_BASE_URL environment variable
      # TODO: npm run build
      # TODO: Upload dist/ artifact nếu cần

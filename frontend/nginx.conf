server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA — mọi route không khớp file tĩnh đều trả về index.html (React Router)
    location / {
        try_files $uri /index.html;
    }

    # Proxy API sang service backend trong cùng docker-compose network
    location /api/ {
        proxy_pass http://backend:5000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Upload tài liệu: mặc định Nginx chỉ cho 1MB (413). Đặt cao hơn MAX_UPLOAD_SIZE_MB của backend (50MB)
    # để backend tự trả lỗi JSON đúng format khi file quá lớn.
    client_max_body_size 100m;

    # SPA — mọi route không khớp file tĩnh đều trả về index.html (React Router)
    location / {
        try_files $uri /index.html;
    }

    # Resolver nội bộ của Docker + biến upstream: Nginx tra lại DNS khi container backend được
    # tạo lại (đổi IP), và không chết lúc khởi động nếu backend chưa lên.
    location /api/ {
        resolver 127.0.0.11 valid=10s;
        set $backend_upstream http://backend:5000;
        proxy_pass $backend_upstream;     # dùng biến → giữ nguyên URI gốc (/api/...)

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # backend bật TRUST_PROXY (ProxyFix x_for=1, x_proto=1) → cần 2 header này để rate-limit đúng IP client
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Mỗi câu hỏi chat = 1 lần suy luận LLM local trên CPU, có thể vượt 60s mặc định của Nginx (504)
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
